name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Siapkan Android SDK Bawaan
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          rm /tmp/gradle.zip

      - name: Susun Struktur Proyek Android & Gradle
        run: |
          echo "=== Daftar File di Repo ==="
          find . -maxdepth 3 -not -path '*/.*'

          mkdir -p app/src/main/java/com/scalp
          mkdir -p app/src/main/aidl/com/scalp

          find . -maxdepth 3 -name "*.kt" ! -path "./app/*" -exec cp {} app/src/main/java/com/scalp/ \;
          find . -maxdepth 3 -name "*.aidl" ! -path "./app/*" -exec cp {} app/src/main/aidl/com/scalp/ \;

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            MANIFEST=$(find . -maxdepth 3 -name "AndroidManifest.xml" ! -path "./app/*" | head -n 1)
            if [ -n "$MANIFEST" ]; then cp "$MANIFEST" app/src/main/AndroidManifest.xml; fi
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScalpShizuku"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.scalp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.scalp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  aidl = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("org.jsoup:jsoup:1.18.1")
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpShizuku-APK
          path: app/build/outputs/apk/debug/app-debug.apk
